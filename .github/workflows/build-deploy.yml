name: Build and Deploy Code

on:
- push
- pull_request

jobs:
  build:
    environment:
      name: testing
    env:
      DATABASE_HOSTNAME: ${{ secrets.DATABASE_HOSTNAME }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
      TEST_DATABASE_HOSTNAME: ${{ secrets.TEST_DATABASE_HOSTNAME }}
      TEST_DATABASE_NAME: ${{ secrets.TEST_DATABASE_NAME }}
      TEST_DATABASE_PORT: ${{ secrets.TEST_DATABASE_PORT }}
      TEST_DATABASE_USERNAME: ${{ secrets.TEST_DATABASE_USERNAME }}
      TEST_DATABASE_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DATABASE_NAME }}
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    runs-on: ubuntu-latest
    steps:
    - name: pulling git repo
      uses: actions/checkout@v6
    - name: Install python version 3.14
      uses: actions/setup-python@v2
      with:
        python-version: "3.14.8"
    - name: Update pip
      run: python -m pip install --upgrade pip
    - name: Install all dependencies
      run: pip install -r requirements.txt
    - name: test with pytest
      run: |
        pip install pytest
        pytest
    # - name: Extract Docker image metadata
    #   id: meta
    #   uses: docker/metadata-action@v6
    #   with:
    #     images: ${{ secrets.DOCKER_HUB_USERNAME }}/free_code_camp_course

    # - name: Log in to Docker Hub
    #   uses: docker/login-action@v4
    #   with:
    #     username: ${{ secrets.DOCKER_HUB_USERNAME }}
    #     password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    # - name: Set up Docker Buildx
    #   uses: docker/setup-buildx-action@v4

    # - name: Build and push Docker image
    #   uses: docker/build-push-action@v7
    #   with:
    #     push: ${{ github.event_name != 'pull_request' }}
    #     tags: ${{ steps.meta.outputs.tags }}
    #     annotations: ${{ steps.meta.outputs.annotations }}
    #     provenance: true
    #     sbom: true

  deploy:
    runs-on: ubuntu-latest
    needs: [ build ]
    environment:
      name: production

    steps:
    - name: Deploy to Ubuntu Server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          whoami
          cd ~/app/src
          git pull
          sudo systemctl restart gunicorn-fastapi
